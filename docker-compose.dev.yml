# Test sources for development and integration tests. Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   (make dev-up / tasks.ps1 dev-up also seeds them)
#
# The credentials below belong to throwaway local test systems, never to the platform;
# the platform stores its copies in Vault when connections are created.

x-dev-password: &dev-password devsource

services:
  src-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: *dev-password
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d sales"]
      interval: 5s
      retries: 20

  src-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: *dev-password
      MYSQL_DATABASE: shop
      MYSQL_USER: dev
      MYSQL_PASSWORD: *dev-password
    command: ["--log-bin=binlog", "--binlog-format=ROW", "--server-id=1"]
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udev -pdevsource --silent"]
      interval: 5s
      retries: 30

  src-mssql:
    # ~2 GB RAM; only started with --profile mssql.
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Dev-Source-2026
    ports: ["127.0.0.1:11433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dev-Source-2026 -Q 'select 1' || exit 1"]
      interval: 10s
      retries: 30

  src-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: *dev-password
    ports: ["127.0.0.1:17017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 30

  src-sftp:
    image: atmoz/sftp:alpine
    command: ["dev:devsource:1001::upload"]
    ports: ["127.0.0.1:12222:22"]

  src-ftp:
    image: stilliard/pure-ftpd:latest
    environment:
      FTP_USER_NAME: dev
      FTP_USER_PASS: devsource
      FTP_USER_HOME: /home/dev
      PUBLICHOST: src-ftp
      FTP_PASSIVE_PORTS: "30000:30009"

  src-smb:
    image: dperson/samba:latest
    command: ["-u", "dev;devsource", "-s", "landing;/share;yes;no;no;dev", "-p"]

  src-s3:
    image: pgsty/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: devsource
      MINIO_ROOT_PASSWORD: devsource-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || mc ready local"]
      interval: 5s
      retries: 20

  mock-api:
    image: dataplat-backend:dev
    entrypoint: ["python", "/samples/mock_api.py"]
    volumes:
      - ./samples:/samples:ro
    ports: ["127.0.0.1:18090:8090"]

  # Seeds every source above: docker compose -f ... run --rm seed
  seed:
    profiles: [tools]
    image: dataplat-backend:dev
    entrypoint: ["python", "/samples/seed.py"]
    environment:
      SEED_KAFKA: redpanda:9092
      SEED_LANDING: /landing
    volumes:
      - ./samples:/samples:ro
      - ${DATAPLAT_LANDING:-./samples/landing}:/landing
    user: root

