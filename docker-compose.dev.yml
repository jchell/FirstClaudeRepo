# Test sources for development and integration tests. Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   (make dev-up / tasks.ps1 dev-up also seeds them)
#
# The credentials below belong to throwaway local test systems, never to the platform;
# the platform stores its copies in Vault when connections are created.

x-dev-password: &dev-password devsource

services:
  src-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: *dev-password
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=30", "-c", "max_wal_senders=30"]
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d sales"]
      interval: 5s
      retries: 20

  src-mysql:
    # 8.0: Debezium 2.7 still uses SHOW MASTER STATUS, which MySQL 8.4 removed.
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: *dev-password
      MYSQL_DATABASE: shop
      MYSQL_USER: dev
      MYSQL_PASSWORD: *dev-password
    command: ["--log-bin=binlog", "--binlog-format=ROW", "--server-id=1"]
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udev -pdevsource --silent"]
      interval: 5s
      retries: 30

  src-mssql:
    # ~2 GB RAM; only started with --profile mssql.
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Dev-Source-2026
      MSSQL_AGENT_ENABLED: "true"  # SQL Server CDC runs as Agent jobs
    ports: ["127.0.0.1:11433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dev-Source-2026 -Q 'select 1' || exit 1"]
      interval: 10s
      retries: 30

  src-mongo:
    image: mongo:7
    # A single-node replica set: CDC reads MongoDB change streams, which need one.
    # Replica sets with auth need a key file; generated at start (test system only).
    entrypoint:
      - bash
      - -c
      - >-
        openssl rand -base64 756 > /tmp/keyfile && chmod 400 /tmp/keyfile && chown 999:999 /tmp/keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: *dev-password
    ports: ["127.0.0.1:17017:27017"]
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once it's primary.
      test:
        - CMD-SHELL
        - >-
          mongosh -u dev -p devsource --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'src-mongo:27017'}]}).ok }"
          && mongosh -u dev -p devsource --quiet --eval "db.hello().isWritablePrimary" | grep -q true
      interval: 5s
      retries: 30

  src-sftp:
    image: atmoz/sftp:alpine
    command: ["dev:devsource:1001::upload"]
    ports: ["127.0.0.1:12222:22"]

  src-ftp:
    image: stilliard/pure-ftpd:latest
    environment:
      FTP_USER_NAME: dev
      FTP_USER_PASS: devsource
      FTP_USER_HOME: /home/dev
      PUBLICHOST: src-ftp
      FTP_PASSIVE_PORTS: "30000:30009"

  src-smb:
    image: dperson/samba:latest
    command: ["-u", "dev;devsource", "-s", "landing;/share;yes;no;no;dev", "-p"]

  src-s3:
    image: pgsty/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: devsource
      MINIO_ROOT_PASSWORD: devsource-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || mc ready local"]
      interval: 5s
      retries: 20

  mock-api:
    image: dataplat-backend:dev
    entrypoint: ["python", "/samples/mock_api.py"]
    volumes:
      - ./samples:/samples:ro
    ports: ["127.0.0.1:18090:8090"]

  # Seeds every source above: docker compose -f ... run --rm seed
  seed:
    profiles: [tools]
    image: dataplat-backend:dev
    entrypoint: ["python", "/samples/seed.py"]
    environment:
      SEED_KAFKA: redpanda:9092
      SEED_LANDING: /landing
    volumes:
      - ./samples:/samples:ro
      - ${DATAPLAT_LANDING:-./samples/landing}:/landing
    user: root

